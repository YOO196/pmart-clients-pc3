name: mfc_app
description: PMart MFC 점원 앱 (Android PDA 우선)
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.4
  flutter: ">=3.47.5"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: ^5.11.1
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  intl: ^0.20.3
  pmart_core:
    path: ../../packages/pmart_core
  pmart_ui:
    path: ../../packages/pmart_ui
  pmart_api_mfc_fulfillment:
    path: ../../packages/pmart_api/gen/mfc-fulfillment
  pmart_api_mfc_inbound:
    path: ../../packages/pmart_api/gen/mfc-inbound
  pmart_api_mfc_quality:
    path: ../../packages/pmart_api/gen/mfc-quality
  pmart_api_mfc_inventory:
    path: ../../packages/pmart_api/gen/mfc-inventory
  pmart_api_cdc_outbound:
    path: ../../packages/pmart_api/gen/cdc-outbound
  pmart_api_cdc_inbound:
    path: ../../packages/pmart_api/gen/cdc-inbound
  pmart_api_mfc_capacity:
    path: ../../packages/pmart_api/gen/mfc-capacity
  pmart_api_product:
    path: ../../packages/pmart_api/gen/product
  pmart_api_delivery_tracking:
    path: ../../packages/pmart_api/gen/delivery-tracking
  pmart_api_delivery_execution:
    path: ../../packages/pmart_api/gen/delivery-execution
  mobile_scanner: ^7.5.0
  flutter_web_auth_2: ^5.1.0
  crypto: ^3.0.8
  # 라이더 화면 표기(번호·가린 이름) 묶음 조회 — rider 0.18.0 RS-MFC(MFC_WORKER 허용).
  pmart_api_rider:
    path: ../../packages/pmart_api/gen/rider
  pmart_api_employee_auth:
    path: ../../packages/pmart_api/gen/employee-auth

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  # 픽PDA 시작 그림(원본 tool/icon/pick_pda_splash.png, 사용자 지시 2026-11-20).
  assets:
    - assets/images/splash.jpg
    - assets/images/pick_pda_logo.png
  # Pretendard (SIL OFL 1.1, assets/fonts/Pretendard-LICENSE.txt) — 고객앱과 같은 글꼴. 기기 기본 글꼴이 얇아
  # 현장에서 안 보였다(사용자 2026-11-20). 400 본문 · 600 이름표·중요 값 · 700 제목 · 800 큰 숫자.
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
        - asset: assets/fonts/Pretendard-ExtraBold.otf
          weight: 800

name: pmart_clients_workspace
publish_to: none

environment:
  sdk: ^3.13.4

# Dart pub workspace. 각 패키지는 `resolution: workspace` 를 쓴다.
workspace:
  - apps/customer_app
  - apps/rider_app
  - apps/mfc_app
  - packages/pmart_core
  - packages/pmart_ui
  - packages/pmart_api/gen/*

# 토스 결제위젯 SDK(customer_app)가 flutter_inappwebview ^6.1.0 을 쓰는데, 안정판 6.1.5(android 1.1.3)는
# AGP 9 에서 proguard-android.txt 때문에 빌드가 깨진다. 같은 계열 6.2.0-beta.3 으로 맞춘다(2026-10-31).
# 안정판이 나오면 지운다.
dependency_overrides:
  flutter_inappwebview: 6.2.0-beta.3
